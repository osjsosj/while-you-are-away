<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#050A19;color:#E9ECF2;font-family:'Schibsted Grotesk',sans-serif}
.nav{display:flex;justify-content:space-between;padding:28px 64px;font-weight:600;font-size:15px}
.nav a{color:#C9D0DC;margin-left:28px}
.head{display:flex;justify-content:space-between;align-items:flex-end;padding:56px 64px 40px}
h1{font-weight:800;font-size:104px;line-height:.9;letter-spacing:-.05em;color:#F4F1E6}
.btn{background:#F0B341;color:#101A33;font-weight:600;font-size:17px;padding:16px 28px;border-radius:999px}
.board{margin:0 64px;background:#0B1430;border-radius:16px;padding:12px}
.r{display:grid;grid-template-columns:3fr 2fr 2fr 2fr;gap:12px;padding:18px 16px;font-size:22px;font-weight:600}
.r+.r{border-top:1px solid rgba(233,236,242,.08)}
.r.h{font-size:14px;color:#A9B3C6}
.r .st{color:#F0B341}
</style></head><body>
<div class="nav"><span>While You’re Away</span><span><a>Services</a><a>About</a><a>Contact</a></span></div>
<div class="head"><h1>Every goodbye,<br>ready to go.</h1><span class="btn">Start your letter box</span></div>
<div class="board">
<div class="r h"><span>Goodbye</span><span>To</span><span>Apart</span><span>Letters</span></div>
<div class="r"><span>Basic training</span><span>Sam</span><span>10 weeks</span><span class="st">12 ready</span></div>
<div class="r"><span>The wedding</span><span>Mom and Dad</span><span>For good</span><span class="st">8 ready</span></div>
<div class="r"><span>Studying abroad</span><span>Daniel</span><span>1 year</span><span class="st">54 ready</span></div>
<div class="r"><span>Moving back home</span><span>Leah</span><span>3 states away</span><span class="st">20 ready</span></div>
<div class="r"><span>Deployment</span><span>Alex</span><span>9 months</span><span class="st">Writing…</span></div>
</div>
</body></html>
